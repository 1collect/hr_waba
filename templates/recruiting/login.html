{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f8">
  <title>Вход</title>
  <link rel="stylesheet" href="{% static 'hr-tech-dashboard/css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'hr-tech-dashboard/css/reset.css' %}">
  <link rel="stylesheet" href="{% static 'hr-tech-dashboard/css/components.css' %}">
  <link rel="stylesheet" href="{% static 'hr-tech-dashboard/css/login.css' %}">
</head>
<body class="login-page">
  <main class="login-card">
    <form method="post" class="login-form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <h1>Вход</h1>
      {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
      <label class="field">
        <span class="field__label">Логин</span>
        <input class="input" name="username" autocomplete="username" autofocus required>
      </label>
      <label class="field">
        <span class="field__label">Пароль</span>
        <input class="input" type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn--primary login-submit" type="submit">Войти</button>
    </form>
  </main>
</body>
</html>
