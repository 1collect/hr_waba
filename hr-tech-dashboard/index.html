<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f8">
  <meta name="description" content="TalentFlow — демонстрационный HR-tech dashboard на HTML, CSS и Vanilla JavaScript.">
  <title>TalentFlow — Главная</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="js/components.js" defer></script>
  <script src="js/charts.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</head>
<body data-page="dashboard">
  <a class="skip-link" href="#main-content">Перейти к содержимому</a>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Боковая панель"></aside>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="page" id="main-content" tabindex="-1">
        <div class="page-header" id="page-header"></div>

        <div class="page-content">
          <section class="dashboard-stats" id="stats" aria-label="Ключевые показатели"></section>

          <section class="dashboard-analytics-grid" aria-label="Основная аналитика">
            <div id="applications-chart"></div>
            <div id="conversion"></div>
          </section>

          <section class="dashboard-lower-grid" aria-label="Вакансии и последние отклики">
            <div id="top-vacancies"></div>
            <div id="recent-applications"></div>
          </section>

          <section id="vacancies-table" aria-label="Таблица вакансий"></section>
        </div>
      </main>
    </div>
  </div>

  <div id="app-overlays"></div>

  <noscript>
    Для работы dashboard необходимо включить JavaScript.
  </noscript>
</body>
</html>
