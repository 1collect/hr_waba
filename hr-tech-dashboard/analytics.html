<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f8">
  <meta name="description" content="TalentFlow — переиспользуемая страница HR-аналитики на Vanilla JavaScript.">
  <title>TalentFlow — Аналитика</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="js/components.js" defer></script>
  <script src="js/charts.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</head>
<body data-page="analytics">
  <a class="skip-link" href="#main-content">Перейти к содержимому</a>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Боковая панель"></aside>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="page" id="main-content" tabindex="-1">
        <div class="page-header" id="page-header"></div>

        <div class="page-content">
          <section id="analytics-tabs" aria-label="Навигация аналитики"></section>
          <section class="analytics-stats" id="analytics-stats" aria-label="Ключевые показатели аналитики"></section>

          <section class="analytics-content-grid" aria-label="График и сводка аналитики">
            <div id="analytics-chart"></div>
            <div id="analytics-side"></div>
          </section>

          <section id="analytics-table" aria-label="Детальная таблица аналитики"></section>
        </div>
      </main>
    </div>
  </div>

  <div id="app-overlays"></div>

  <noscript>
    Для работы страницы аналитики необходимо включить JavaScript.
  </noscript>
</body>
</html>
